services:
  arb-bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - backend/.env
    ports:
      # Bound to loopback: the control API must sit behind a TLS reverse proxy,
      # never be published straight onto a public interface.
      - "127.0.0.1:8000:8000"
    volumes:
      # Matches the default DATABASE_URL (sqlite+aiosqlite:///./data/arb_bot.db)
      # relative to WORKDIR /app/backend, so the database actually persists.
      - ./data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/status', timeout=4).status == 200 else 1)\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
